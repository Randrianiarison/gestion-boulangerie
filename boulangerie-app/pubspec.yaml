name: boulangerie_app
description: "Gestion de la boulangerie familiale : production, ventes, clôture, salaires (mg/fr)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  dio: ^5.11.1
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

# Icône de l'appli : images dessinées par tool/generate_app_icon.dart, puis
# `dart run flutter_launcher_icons` génère les tailles Android et iOS.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#B5651D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
